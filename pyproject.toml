[project]
name = "plasticity-repro"
version = "0.1.0"
description = "Reproduction and limitation tests for 'Agent Plasticity: Measuring Self-Improvement Through Experience' (arXiv:2610.08902)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plasticity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
